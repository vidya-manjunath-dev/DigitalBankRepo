<div class="register-container" style="display: flex; justify-content: center; align-items: center; padding: 20px;">
    <mat-card style="width: 500px; padding: 20px;">
        <mat-card-header>
            <mat-card-title>Create Account</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()"
                style="display: flex; flex-direction: column; gap: 16px; margin-top: 20px;">

                <mat-form-field appearance="outline">
                    <mat-label>Full Name</mat-label>
                    <input matInput formControlName="name">
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Email</mat-label>
                    <input matInput formControlName="email" type="email">
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Password</mat-label>
                    <input matInput formControlName="password" [type]="hide ? 'password' : 'text'">
                    <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'"
                        [attr.aria-pressed]="hide" type="button">
                        <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                    <mat-hint>Password contains at least 6 characters</mat-hint>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Phone</mat-label>
                    <input matInput formControlName="phone">
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Address</mat-label>
                    <input matInput formControlName="address">
                </mat-form-field>

                <div *ngIf="successMessage" style="color: green; text-align: center;">{{ successMessage }}</div>
                <div *ngIf="error" style="color: red; text-align: center;">{{ error }}</div>

                <button mat-raised-button color="primary" type="submit"
                    [disabled]="registerForm.invalid">Register</button>
            </form>
        </mat-card-content>
        <mat-card-actions style="justify-content: center;">
            <a routerLink="/login">Already have an account? Login</a>
        </mat-card-actions>
    </mat-card>
</div>
