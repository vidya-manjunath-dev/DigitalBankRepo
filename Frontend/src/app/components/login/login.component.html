<div class="login-page">
  <mat-card class="login-card">
    <div class="login-header">
      <div class="icon-circle">
        <mat-icon class="bank-icon">account_balance</mat-icon>
      </div>
      <h1 class="app-title">DigitalBank Lite</h1>
      <p class="subtitle">Secure Login</p>
    </div>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email Address</mat-label>
          <input matInput formControlName="email" type="email" placeholder="user@example.com">
          <mat-icon matPrefix>email</mat-icon>
          <mat-error *ngIf="loginForm.get('email')?.invalid">Valid email is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" [type]="hide ? 'password' : 'text'">
          <mat-icon matPrefix>lock</mat-icon>
          <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'"
            [attr.aria-pressed]="hide" type="button">
            <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
        </mat-form-field>

        <div *ngIf="error" class="error-message">
          <mat-icon>error</mat-icon> {{ error }}
        </div>

        <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid" class="login-btn">
          LOGIN
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions class="login-footer">
      <a routerLink="/register" class="register-link">Don't have an account? <strong>Register here</strong></a>
    </mat-card-actions>
  </mat-card>
</div>
